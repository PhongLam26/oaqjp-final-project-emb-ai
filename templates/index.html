<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
    <main class="page-shell">
        <section class="detector-card" aria-labelledby="page-title">
            <p class="eyebrow">IBM Watson NLP</p>
            <h1 id="page-title">Emotion Detector</h1>
            <p class="intro">Discover the emotions expressed in a sentence.</p>
            <form id="analysisForm">
                <label for="textToAnalyze">Text to analyze</label>
                <textarea id="textToAnalyze" name="textToAnalyze" rows="4"
                    placeholder="For example: I am really mad about this"
                    aria-describedby="inputHint"></textarea>
                <p id="inputHint" class="input-hint">Enter a sentence in English.</p>
                <button id="analyzeButton" type="submit">
                    <span>Analyze emotions</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>
            </form>
            <section id="system_response" class="result-panel" aria-live="polite"
                aria-atomic="true" aria-label="Emotion analysis result">
                <div class="empty-state">
                    <span class="sparkle" aria-hidden="true">✳</span>
                    <p>Your emotion scores will appear here.</p>
                </div>
            </section>
            <footer>Powered by IBM Watson NLP</footer>
        </section>
    </main>
</body>
</html>
